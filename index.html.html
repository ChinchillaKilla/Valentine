<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #2b1b55, #0b0b12 60%);
      color: white;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: min(500px, 90vw);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 32px;
    }

    .buttons {
      position: relative;
      height: 140px;
    }

    button {
      padding: 14px 22px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      border: none;
      cursor: pointer;
    }

    .yes {
      background: #ff2d55;
      color: white;
    }

    .no {
      background: white;
      color: black;
      position: absolute;
      left: 55%;
      top: 50%;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result h2 {
      font-size: 42px;
    }

    body.yay .card {
      display: none;
    }

    body.yay .result {
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my valentine?</h1>
    <div class="buttons">
      <button class="yes" id="yes">Ja</button>
      <button class="no" id="no">Nein</button>
    </div>
  </div>

  <div class="result">
    <h2>YAYYY 🌹❤️<br>BEST DECISION EVER!!!</h2>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    function moveNo() {
      const padding = 10;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", function(e) {
      e.preventDefault();
      moveNo();
    });

    yesBtn.addEventListener("click", function() {
      document.body.classList.add("yay");
    });
  </script>

</body>
</html>
